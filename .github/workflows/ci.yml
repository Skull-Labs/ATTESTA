name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node workspaces (lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint / typecheck
        run: npm run lint --workspaces --if-present

      - name: Build shared, API, and web
        run: npm run build --workspaces --if-present

  contracts:
    name: Soroban contracts (test + wasm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target

      - name: Unit tests
        run: cargo test

      - name: Build WASM (roles)
        run: cargo build --release --target wasm32v1-none -p roles

      - name: Build WASM (certificate)
        run: cargo build --release --target wasm32v1-none -p certificate
